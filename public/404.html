<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0A0A0A" />
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <title>Página não encontrada — Fast Up</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 20px; background: #0A0A0A; color: #E8E8E8; font-family: system-ui, sans-serif; }
      main { width: 100%; max-width: 520px; }
      img { display: block; width: 180px; max-width: 100%; height: auto; margin-bottom: 56px; }
      .code { color: #54D654; font-size: 14px; letter-spacing: .18em; }
      h1 { margin: 16px 0; font-size: clamp(32px, 6vw, 48px); line-height: 1.1; letter-spacing: -.03em; }
      .message { color: #B7C7B7; line-height: 1.7; }
      .button { display: inline-block; margin-top: 20px; padding: 14px 24px; border-radius: 40px; background: #1DB31D; color: #0A0A0A; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 2px solid #54D654; outline-offset: 6px; }
      .button:hover { background: #54D654; }
    </style>
  </head>
  <body>
    <main>
      <a href="/" aria-label="Fast Up — início"><img src="/assets/logo-dark.webp" width="891" height="225" alt="Fast Up — MKT Imobiliário" /></a>
      <p class="code">404</p>
      <h1>Essa página não está por aqui.</h1>
      <p class="message">Volte para a página inicial e conheça os serviços e o curso da Fast Up.</p>
      <a class="button" href="/">Voltar ao início ↗</a>
    </main>
  </body>
</html>
